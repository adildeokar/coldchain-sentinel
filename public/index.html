<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColdChain Sentinel — Azure IoT Cold-Storage Monitoring Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b1220'/><path d='M16 4v24M6 10l20 12M26 10L6 22' stroke='%2338bdf8' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M16 5v22M6.5 10.5l19 11M25.5 10.5l-19 11" class="logo-flake"/><circle cx="16" cy="16" r="3.2" class="logo-dot"/></svg>
    <div>
      <div class="b-title">ColdChain Sentinel</div>
      <div class="b-sub">Azure IoT Hub cold-storage monitoring · Raspberry Pi edge · simulation</div>
    </div>
  </div>

  <div class="pills">
    <span class="pill" id="pill-room" title="Cold-room status as decided by the Raspberry Pi">ROOM —</span>
    <span class="pill" id="pill-net" title="Site WAN link">WAN —</span>
    <span class="pill" id="pill-mqtt" title="Pi → IoT Hub MQTT session">MQTT —</span>
    <span class="pill" id="pill-queue" title="Readings waiting in the Pi's SQLite queue">QUEUE 0</span>
    <span class="pill" id="pill-server" title="Connection to the ColdChain Sentinel server (Server-Sent Events)">SERVER …</span>
  </div>

  <div class="clock" title="Simulated wall-clock time">
    <div id="sim-clock">--:--:--</div>
    <div id="sim-elapsed" class="sub">T+00:00:00</div>
  </div>

  <div class="seg" id="speed" role="group" aria-label="Simulation speed">
    <button data-speed="1">1×</button>
    <button data-speed="5" class="on">5×</button>
    <button data-speed="10">10×</button>
    <button data-speed="30">30×</button>
    <button data-speed="60">60×</button>
  </div>
  <button id="btn-play" class="btn primary" title="Pause / resume (Space)">❚❚ Pause</button>
  <button id="btn-sound" class="btn icon" title="Buzzer sound (Web Audio)">🔇</button>
  <button id="btn-theme" class="btn icon" title="Light / dark theme">◐</button>
  <button id="btn-reset" class="btn" title="Restart the simulation from zero">↺ Reset</button>
</header>

<nav id="sidenav" aria-label="Views">
  <button data-view="live" class="on"><span class="ni">◉</span><span>Live Simulation</span></button>
  <button data-view="hardware"><span class="ni">▦</span><span>Raspberry Pi &amp; Circuit</span></button>
  <button data-view="cloud"><span class="ni">☁</span><span>Azure IoT Hub</span></button>
  <button data-view="dashboard"><span class="ni">▤</span><span>Operator Dashboard</span></button>
  <button data-view="results"><span class="ni">⚖</span><span>Experiments &amp; Results</span></button>
  <button data-view="architecture"><span class="ni">⬡</span><span>Architecture &amp; Data Flow</span></button>
  <button data-view="source"><span class="ni">{}</span><span>Source Code</span></button>
  <button data-view="report"><span class="ni">▣</span><span>Project Report</span></button>
  <button data-view="guide"><span class="ni">?</span><span>Demo Guide &amp; Viva</span></button>
  <div class="nav-foot">
    <button id="btn-autodemo" class="btn primary wide">▶ Guided demo</button>
    <div class="nav-note">The simulation runs on the <b>Node.js server</b>; this page only displays its state. Firmware and cloud code in <b>Source Code</b> are the real deployable code.</div>
  </div>
</nav>

<main id="views">
  <section class="view on" id="view-live"></section>
  <section class="view" id="view-hardware"></section>
  <section class="view" id="view-cloud"></section>
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-results"></section>
  <section class="view" id="view-architecture"></section>
  <section class="view" id="view-source"></section>
  <section class="view" id="view-report"></section>
  <section class="view" id="view-guide"></section>
</main>

<div id="toasts" aria-live="polite"></div>
<div id="narration" hidden><div class="n-step"></div><div class="n-text"></div><div class="n-actions"><button class="btn" id="n-skip">Next ▸</button><button class="btn" id="n-stop">Stop demo</button></div></div>
<div id="modal" hidden><div class="m-card"><div class="m-head"><span class="m-title"></span><button class="btn icon m-close">✕</button></div><div class="m-body"></div></div></div>
<div id="tip" hidden></div>

<!-- shared with the server: formatting helpers, configuration, alarm-rule labels -->
<script src="/engine/util.js"></script>
<script src="/engine/config.js"></script>
<script src="/engine/rules.js"></script>
<!-- browser UI: mirrors server state, renders it, sends actions back -->
<script src="js/ui/dom.js"></script>
<script src="js/remote.js"></script>
<script src="js/ui/charts.js"></script>
<script src="js/ui/highlight.js"></script>
<script src="js/ui/topology.js"></script>
<script src="js/ui/circuit.js"></script>
<script src="js/ui/diagrams.js"></script>
<script src="js/views/live.js"></script>
<script src="js/views/hardware.js"></script>
<script src="js/views/cloud.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/results.js"></script>
<script src="js/views/architecture.js"></script>
<script src="js/views/source.js"></script>
<script src="js/views/report.js"></script>
<script src="js/views/guide.js"></script>
<script src="js/app.js"></script>
</body>
</html>
